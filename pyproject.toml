[project]
name = "telecom-support-agent"
version = "0.1.0"
description = "Learning project: support agent for a telecom operator (Strands Agents + Claude + RAG on Chroma)"
requires-python = ">=3.10"
dependencies = [
    "strands-agents[anthropic]>=1.60",
    "chromadb>=1.0",
    "pyyaml>=6.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["app", "backend", "evals"]
